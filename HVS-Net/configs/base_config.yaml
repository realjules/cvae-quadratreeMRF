# HVS-Net/configs/base_config.yaml

# This YAML file holds all the hyperparameters and configuration settings 
# for our experiments. This allows us to easily track and modify settings 
# without changing the code.
#
# Example settings:
# - Learning rate
# - Batch size
# - Loss weights (for combining the three loss components)
# - Model dimensions (latent_dim, etc.)
# - Data paths

# Data settings
data:
  data_dir: 'C:/Users/robot/OneDrive - BBOXX/Desktop/git repo/3. MyResearch/cvae-quadratreeMRF/input/top/'
  label_dir: 'C:/Users/robot/OneDrive - BBOXX/Desktop/git repo/3. MyResearch/cvae-quadratreeMRF/input/gt/'
  labeled_percentage: 10

# Model settings
model:
  n_channels: 3
  n_classes: 6
  latent_dim: 256
  encoder_hidden_dims: [64, 128, 256]
  decoder_hidden_dims: [256, 128, 64, 32]

# Training settings
training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.001
  optimizer: 'AdamW'
  scheduler: 'CosineAnnealingLR'
  checkpoint_dir: 'checkpoints/'

# Loss settings
loss:
  supervised_weight: 1.0
  reconstruction_weight: 0.0
  consistency_weight: 0.0
  kl_weight: 0.0
